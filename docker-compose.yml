version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reserveproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reserveproof
      POSTGRES_USER: reserveproof
      POSTGRES_PASSWORD: reserveproof
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
